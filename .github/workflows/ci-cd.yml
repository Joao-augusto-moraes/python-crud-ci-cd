name: CI/CD Pipeline Python

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Testes (CI)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python (mesma versão da imagem Docker)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Rodar os testes do CRUD
      run: pytest test_crud.py -v

  docker:
    name: Build da imagem Docker (CD)
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Construir a imagem
      run: docker build -t crud-python:${{ github.sha }} .

    - name: Testar a imagem (smoke test)
      run: docker run --rm crud-python:${{ github.sha }}

  notificar:
    name: Alerta no Discord
    needs: [test, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Enviar status
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.LIZARD_HOOK }}
        status: ${{ (needs.test.result == 'success' && needs.docker.result == 'success') && 'success' || 'failure' }}
        title: "Status da Pipeline CI/CD"
        description: "O workflow finalizou na branch ${{ github.ref_name }}"
